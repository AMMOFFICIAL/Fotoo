<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blok Warna Jari Tangan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            height: 100vh;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
        /* Video aslinya disembunyikan, kita tampilkan hasil gambarnya di canvas */
        .input_video {
            display: none; 
        }
        .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Efek cermin (mirror) agar gerakan lebih natural */
        }
        p {
            margin-top: 20px;
            text-align: center;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>Detektor 4 Jari (Jempol & Telunjuk)</h2>
    <div class="container">
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>
    <p>Arahkan <strong>kedua tangan Anda</strong> ke kamera. <br>Bentuk blok warna akan mengikuti ujung jempol dan telunjuk dari kedua tangan.</p>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Fungsi ini dipanggil setiap kali MediaPipe selesai mendeteksi frame
        function onResults(results) {
            canvasCtx.save();
            // Bersihkan kanvas
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            // Gambar tangkapan video ke kanvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Jika terdeteksi minimal 2 tangan
            if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                
                const hand1 = results.multiHandLandmarks[0];
                const hand2 = results.multiHandLandmarks[1];

                // Titik landmark MediaPipe: 
                // 4 = Ujung Jempol (Thumb tip)
                // 8 = Ujung Telunjuk (Index finger tip)

                // Ambil koordinat x dan y (dikalikan dengan lebar & tinggi kanvas)
                const p1 = { x: hand1[4].x * canvasElement.width, y: hand1[4].y * canvasElement.height }; // Jempol Tangan 1
                const p2 = { x: hand1[8].x * canvasElement.width, y: hand1[8].y * canvasElement.height }; // Telunjuk Tangan 1
                const p3 = { x: hand2[8].x * canvasElement.width, y: hand2[8].y * canvasElement.height }; // Telunjuk Tangan 2
                const p4 = { x: hand2[4].x * canvasElement.width, y: hand2[4].y * canvasElement.height }; // Jempol Tangan 2

                // Mulai menggambar blok warna (Poligon 4 sisi)
                canvasCtx.beginPath();
                canvasCtx.moveTo(p1.x, p1.y);
                canvasCtx.lineTo(p2.x, p2.y);
                canvasCtx.lineTo(p3.x, p3.y);
                canvasCtx.lineTo(p4.x, p4.y);
                canvasCtx.closePath();

                // Beri warna blok (contoh: Hijau semi-transparan)
                canvasCtx.fillStyle = 'rgba(0, 255, 128, 0.6)';
                canvasCtx.fill();

                // Beri garis tepi agar lebih terlihat
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = '#00FF00';
                canvasCtx.stroke();
            }
            
            canvasCtx.restore();
        }

        // Inisialisasi MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,           // Batasi hanya mencari 2 tangan
            modelComplexity: 1,       // Keseimbangan antara kecepatan dan akurasi
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Inisialisasi dan nyalakan kamera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        camera.start();
    </script>
</body>
</html>
